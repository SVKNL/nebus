# Ключ проекта для SonarQube / SonarCloud.
# Локальный запуск: docker compose --profile sonar up -d sonarqube
# затем: docker compose --profile sonar run --rm sonar-scanner
sonar.projectKey=nebus-payments
sonar.projectName=Nebus Payments
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=tests
sonar.exclusions=alembic/**,tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.ruff.reportPaths=ruff-report.json

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=false
